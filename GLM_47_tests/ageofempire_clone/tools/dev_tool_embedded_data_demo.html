<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded JSON Decompressor</title>
    <style>
        :root {
            --primary-color: #10b981;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --code-bg: #1e1e1e;
            --code-text: #d4d4d4;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 900px;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        header {
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 1rem;
        }

        h1 { margin: 0; font-size: 1.5rem; }
        p { margin: 0.5rem 0 0; color: var(--text-muted); }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        
        .status-indicator.loading { background: #e0f2fe; color: #0369a1; }
        .status-indicator.success { background: #dcfce7; color: #15803d; }
        .status-indicator.error { background: #fee2e2; color: #b91c1c; }

        .results-area {
            display: none;
            flex-direction: column;
            gap: 1rem;
        }

        .results-area.active {
            display: flex;
        }

        pre {
            background: var(--code-bg);
            color: var(--code-text);
            padding: 1.5rem;
            border-radius: 8px;
            overflow: auto;
            max-height: 500px;
            font-size: 0.85rem;
            margin: 0;
        }

        .key-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .info-card {
            background: #f1f5f9;
            padding: 1rem;
            border-radius: 8px;
        }
        
        .info-card h3 { margin: 0 0 0.5rem; font-size: 0.9rem; color: var(--text-muted); }
        .info-card div { font-weight: 600; font-size: 1.1rem; }

    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Embedded Data Reader</h1>
            <p>This page loads a compressed JSON object embedded directly in the HTML.</p>
        </header>

        <main>
            <div id="status" class="status-indicator loading">Initializing...</div>

            <div class="results-area" id="results">
                <div class="key-info">
                    <div class="info-card">
                        <h3>Status</h3>
                        <div>Decompression Successful</div>
                    </div>
                    <div class="info-card">
                        <h3>Data Type</h3>
                        <div id="dataType">Object</div>
                    </div>
                    <div class="info-card">
                        <h3>Keys Found</h3>
                        <div id="keyCount">0</div>
                    </div>
                </div>

                <div style="margin-top: 1rem;">
                    <label for="jsonOutput" style="font-weight: 600; display: block; margin-bottom: 0.5rem;">Resulting JSON Data:</label>
                    <pre id="jsonOutput"></pre>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Check browser support
        if (!window.DecompressionStream) {
            updateStatus('error', 'Browser does not support DecompressionStream API.');
            throw new Error("DecompressionStream not supported");
        }

        const statusEl = document.getElementById('status');
        const resultsArea = document.getElementById('results');
        const jsonOutput = document.getElementById('jsonOutput');
        const keyCountEl = document.getElementById('keyCount');

        async function loadEmbeddedData() {
            try {
                const scriptTag = document.getElementById('embedded-data');
                // Get the text content (the base64 string)
                const base64Data = scriptTag.textContent.trim();

                if (!base64Data || base64Data === '<!-- PASTE YOUR BASE64 STRING HERE -->') {
                    updateStatus('error', 'No Base64 data found in script tag.');
                    return;
                }

                // 1. Decode Base64 to Binary String
                // We use the same method as encoding: loop through chars
                const binaryString = atob(base64Data);
                const len = binaryString.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }

                // 2. Create Blob from Uint8Array
                const blob = new Blob([bytes], { type: 'application/json' });

                // 3. Create ReadableStream from Blob
                const stream = blob.stream();

                // 4. Pipe through DecompressionStream (gzip)
                const decompressedStream = stream.pipeThrough(new DecompressionStream("gzip"));

                // 5. Convert back to text/JSON
                const response = new Response(decompressedStream);
                const text = await response.text();
                
                // 6. Parse JSON
                const jsonData = JSON.parse(text);

                // Success: Update UI
                updateStatus('success', 'Data Loaded Successfully');
                resultsArea.classList.add('active');
                
                // Display stats
                keyCountEl.textContent = Array.isArray(jsonData) ? `${jsonData.length} items` : `${Object.keys(jsonData).length} keys`;
                
                // Display JSON prettified
                jsonOutput.textContent = JSON.stringify(jsonData, null, 2);

                console.log("Successfully decompressed JSON:", jsonData);

            } catch (err) {
                console.error("Decompression failed:", err);
                updateStatus('error', 'Failed to decompress data. Check console.');
            }
        }

        function updateStatus(type, message) {
            statusEl.className = `status-indicator ${type}`;
            statusEl.textContent = message;
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', loadEmbeddedData);

    </script>
</body>
</html>

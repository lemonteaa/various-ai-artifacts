<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON to Base64 Gzip Converter</title>
    <style>
        :root {
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 800px;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        header {
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--text-main);
        }

        p {
            margin: 0.5rem 0 0;
            color: var(--text-muted);
        }

        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            transition: border-color 0.2s, background-color 0.2s;
            cursor: pointer;
            position: relative;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--primary-color);
            background-color: #eff6ff;
        }

        .upload-area input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .icon-upload {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .status-panel {
            display: none; /* Hidden by default */
            flex-direction: column;
            gap: 1rem;
            background: #f1f5f9;
            padding: 1rem;
            border-radius: 8px;
        }

        .status-panel.active {
            display: flex;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            font-size: 0.9rem;
        }

        .stat-item {
            background: white;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .stat-label {
            display: block;
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-bottom: 4px;
        }

        .stat-value {
            font-weight: 600;
            color: var(--text-main);
        }

        .output-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.85rem;
            resize: vertical;
            box-sizing: border-box;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button.secondary {
            background-color: white;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        button.secondary:hover {
            background-color: #f1f5f9;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #10b981;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
        }
        
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>JSON Compressor</h1>
            <p>Upload a JSON file to compress it with Gzip and convert to Base64.</p>
        </header>

        <main>
            <div class="upload-area" id="dropZone">
                <input type="file" id="fileInput" accept=".json" />
                <span class="icon-upload">📂</span>
                <h3>Click to upload or drag JSON here</h3>
                <p style="font-size: 0.85rem;">Supports .json files</p>
            </div>

            <div class="status-panel" id="statusPanel">
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-label">Original Size</span>
                        <span class="stat-value" id="originalSize">-</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Compressed Size</span>
                        <span class="stat-value" id="compressedSize">-</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Reduction</span>
                        <span class="stat-value" id="reduction">-</span>
                    </div>
                </div>

                <div class="output-group">
                    <label for="outputBase64">Base64 Output (Embed this in your HTML)</label>
                    <textarea id="outputBase64" readonly></textarea>
                </div>

                <div class="btn-group">
                    <button class="secondary" id="resetBtn">Reset</button>
                    <button id="copyBtn">Copy to Clipboard</button>
                </div>
            </div>
        </main>
    </div>

    <div class="toast" id="toast">Copied to clipboard!</div>

    <script>
        // Check browser support for CompressionStream
        if (!window.CompressionStream) {
            alert("Your browser does not support the Compression Stream API. Please use Chrome, Edge, or Firefox 113+.");
        }

        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const statusPanel = document.getElementById('statusPanel');
        const outputBase64 = document.getElementById('outputBase64');
        const copyBtn = document.getElementById('copyBtn');
        const resetBtn = document.getElementById('resetBtn');
        const toast = document.getElementById('toast');

        // Stats elements
        const originalSizeEl = document.getElementById('originalSize');
        const compressedSizeEl = document.getElementById('compressedSize');
        const reductionEl = document.getElementById('reduction');

        // Drag and drop visual feedback
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                processFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                processFile(e.target.files[0]);
            }
        });

        resetBtn.addEventListener('click', () => {
            fileInput.value = '';
            statusPanel.classList.remove('active');
            outputBase64.value = '';
        });

        copyBtn.addEventListener('click', () => {
            outputBase64.select();
            navigator.clipboard.writeText(outputBase64.value).then(() => {
                showToast();
            });
        });

        function showToast() {
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        function formatBytes(bytes, decimals = 2) {
            if (!+bytes) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
        }

        async function processFile(file) {
            if (file.type !== "application/json" && !file.name.endsWith('.json')) {
                alert("Please upload a valid JSON file.");
                return;
            }

            try {
                // 1. Read the file
                const stream = file.stream();
                
                // 2. Compress the stream (Gzip)
                const compressedStream = stream.pipeThrough(new CompressionStream('gzip'));
                
                // 3. Convert compressed stream to Blob
                const compressedBlob = await new Response(compressedStream).blob();
                
                // 4. Convert Blob to ArrayBuffer
                const buffer = await compressedBlob.arrayBuffer();
                
                // 5. Convert ArrayBuffer to Base64
                // We use a loop to push into a byte array to avoid stack overflow with spread operator on large files
                let binary = '';
                const bytes = new Uint8Array(buffer);
                const len = bytes.byteLength;
                for (let i = 0; i < len; i++) {
                    binary += String.fromCharCode(bytes[i]);
                }
                const base64 = btoa(binary);

                // Update UI
                originalSizeEl.textContent = formatBytes(file.size);
                compressedSizeEl.textContent = formatBytes(compressedBlob.size);
                
                const reduction = ((1 - (compressedBlob.size / file.size)) * 100).toFixed(1);
                reductionEl.textContent = `${reduction}%`;

                outputBase64.value = base64;
                statusPanel.classList.add('active');

            } catch (err) {
                console.error(err);
                alert("An error occurred while processing the file. See console for details.");
            }
        }
    </script>
</body>
</html>

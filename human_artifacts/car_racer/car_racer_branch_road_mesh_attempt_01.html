            /**
             * Creates a procedural stadium.
             * @param {Object} config - Configuration object matching the GUI state.
             * @returns {THREE.Group} - The root 3D object.
             */
            static createStadium(config) {
                const group = new THREE.Group();
                const { radius, startAngle, endAngle, length, tiers, rowsPerTier, seatWidth, rowDepth, crowdDensity, colorSeats, colorCrowd, addRoof, roofHeight, roofColor, mode, colorBase, audienceColors, colorPillar } = config;

                const seatsData = [];
                let maxR = 0;
                let maxDepth = 0; // For linear

                const startRad = THREE.MathUtils.degToRad(startAngle);
                const endRad = THREE.MathUtils.degToRad(endAngle);
                const angleSpan = endRad - startRad;

                // --- 1. Calculate Positions ---
                for (let t = 0; t < tiers; t++) {
                    const tierOffset = t * (rowsPerTier * rowDepth);
                    for (let r = 0; r < rowsPerTier; r++) {
                        const rowOffset = tierOffset + (r * rowDepth);
                        
                        if (mode === 'Arc') {
                            const currentRadius = radius + rowOffset;
                            const circumference = currentRadius * angleSpan;
                            const seatsInRow = Math.max(1, Math.floor(circumference / seatWidth));
                            maxR = Math.max(maxR, currentRadius);

                            for (let s = 0; s < seatsInRow; s++) {
                                const ratio = s / seatsInRow;
                                const angle = startRad + (ratio * angleSpan);
                                const x = Math.cos(angle) * currentRadius;
                                const z = Math.sin(angle) * currentRadius;
                                const y = (r + (t * rowsPerTier)) * 0.5;
                                seatsData.push({ x, y, z, rotY: -angle });
                            }
                        } else { // Linear
                            const currentDepth = 5 + rowOffset;
                            const seatsInRow = Math.floor(length / seatWidth);
                            maxDepth = Math.max(maxDepth, currentDepth);

                            for (let s = 0; s < seatsInRow; s++) {
                                const z = -length/2 + (s * seatWidth) + (seatWidth/2);
                                const x = currentDepth;
                                const y = (r + (t * rowsPerTier)) * 0.5;
                                seatsData.push({ x, y, z, rotY: Math.PI });
                            }
                        }
                    }
                }

                if (seatsData.length === 0) return group;

                // --- 2. Base Platform ---
                //const baseMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.8 });
                const baseMat = new THREE.MeshStandardMaterial({ color: colorBase, roughness: 0.8 });
                const baseHeight = 1.0;

                if (mode === 'Arc') {
                    /*const shape = new THREE.Shape();
                    shape.absarc(0, 0, maxR + 2, endRad, startRad, false);
                    const hole = new THREE.Path();
                    hole.absarc(0, 0, radius - 2, startRad, endRad, true);
                    shape.holes.push(hole);*/
                    // Create a proper Donut Sector shape without using 'holes' to fix geometry artifacts
                    // We trace the outer arc CCW, then line to inner, trace inner arc CW, then close.
                    const shape = new THREE.Shape();
                    const outerR = maxR + 2;
                    const innerR = radius - 2;

                    // Start at outer StartAngle
                    const startX = Math.cos(startRad) * outerR;
                    const startY = -Math.sin(startRad) * outerR;
                    shape.moveTo(startX, startY);

                    // Outer Arc (CCW from Start to End)
                    shape.absarc(0, 0, outerR, -startRad, -endRad, true);

                    // Line to Inner EndAngle
                    const endX = Math.cos(endRad) * innerR;
                    const endY = -Math.sin(endRad) * innerR;
                    shape.lineTo(endX, endY);

                    // Inner Arc (CW from End to Start) to create the 'band' effect
                    shape.absarc(0, 0, innerR, -endRad, -startRad, false);

                    // Close path (line back to outer start)
                    shape.lineTo(startX, startY);

 	
                    const geometry = new THREE.ExtrudeGeometry(shape, { depth: baseHeight, bevelEnabled: false });
                    geometry.rotateX(-Math.PI / 2); 
                    const baseMesh = new THREE.Mesh(geometry, baseMat);
                    baseMesh.receiveShadow = true;
                    baseMesh.castShadow = true;
                    group.add(baseMesh);
                } else {
                    const width = maxDepth + 4; // Using maxDepth as X-extent here
                    const baseGeo = new THREE.BoxGeometry(width, baseHeight, length);
                    const baseMesh = new THREE.Mesh(baseGeo, baseMat);
                    baseMesh.position.set(width/2, baseHeight/2, 0);
                    baseMesh.receiveShadow = true;
                    baseMesh.castShadow = true;
                    group.add(baseMesh);
                }

                // --- 3. Seats & Crowd ---
                const seatGeo = new THREE.BoxGeometry(seatWidth, 0.5, 1);
                const seatMat = new THREE.MeshStandardMaterial({ color: colorSeats });
                const seatMesh = new THREE.InstancedMesh(seatGeo, seatMat, seatsData.length);
                seatMesh.castShadow = true;
                seatMesh.receiveShadow = true;

                const crowdCount = Math.floor(seatsData.length * crowdDensity);
                const personGeo = new THREE.CylinderGeometry(0.35, 0.35, 1.6, 6);
                //const personMat = new THREE.MeshStandardMaterial({ color: colorCrowd });
                // Note: colorCrowd is deprecated, using audienceColors array
                const personMat = new THREE.MeshStandardMaterial({ color: 0xffffff }); // Base white, tinted by instanceColor
                const personMesh = new THREE.InstancedMesh(personGeo, personMat, crowdCount);
                personMesh.castShadow = true;
                personMesh.receiveShadow = true;
                personMesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(crowdCount * 3), 3);

                const dummy = new THREE.Object3D();
                const tempColor = new THREE.Color();

                let personIdx = 0;

                // Shuffle indices for random crowd distribution
                const indices = seatsData.map((_, i) => i);
                for (let i = indices.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [indices[i], indices[j]] = [indices[j], indices[i]];
                }
                const personIndices = new Set(indices.slice(0, crowdCount));

                for (let i = 0; i < seatsData.length; i++) {
                    const d = seatsData[i];
                    dummy.position.set(d.x, d.y + 0.25, d.z);
                    dummy.rotation.set(0, d.rotY, 0);
                    dummy.updateMatrix();
                    seatMesh.setMatrixAt(i, dummy.matrix);

                    if (personIndices.has(i)) {
                        dummy.position.set(d.x, d.y + 0.25 + 0.8, d.z);
                        dummy.scale.set(1, 0.9 + Math.random()*0.2, 1);
                        dummy.updateMatrix();
                        personMesh.setMatrixAt(personIdx++, dummy.matrix);

                        
                        // Assign random color from palette
                        const randomCol = audienceColors[Math.floor(Math.random() * audienceColors.length)];
                        tempColor.set(randomCol);
                        personMesh.setColorAt(personIdx, tempColor);
                        

                        dummy.scale.set(1, 1, 1);
                    }
                }
                group.add(seatMesh);
                group.add(personMesh);

                // --- 4. Roof ---
                if (addRoof) {
                    const roofMat = new THREE.MeshStandardMaterial({ color: roofColor, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
                    if (mode === 'Arc') {
                        //const roofR = maxR + 2;
                        const shape = new THREE.Shape();

                        /*shape.absarc(0, 0, roofR, endRad, startRad, false);
                        const hole = new THREE.Path();
                        hole.absarc(0, 0, radius - 2, startRad, endRad, true);
                        shape.holes.push(hole);*/
                    // Create a proper Donut Sector shape without using 'holes' to fix geometry artifacts
                    // We trace the outer arc CCW, then line to inner, trace inner arc CW, then close.
                    //const shape = new THREE.Shape();
                    const outerR = maxR + 2;
                    const innerR = radius - 2;

                    // Start at outer StartAngle
                    const startX = Math.cos(startRad) * outerR;
                    const startY = -Math.sin(startRad) * outerR;
                    shape.moveTo(startX, startY);

                    // Outer Arc (CCW from Start to End)
                    shape.absarc(0, 0, outerR, -startRad, -endRad, true);

                    // Line to Inner EndAngle
                    const endX = Math.cos(endRad) * innerR;
                    const endY = -Math.sin(endRad) * innerR;
                    shape.lineTo(endX, endY);

                    // Inner Arc (CW from End to Start) to create the 'band' effect
                    shape.absarc(0, 0, innerR, -endRad, -startRad, false);

                    // Close path (line back to outer start)
                    shape.lineTo(startX, startY);

let roofR = outerR;


                        const roofGeo = new THREE.ExtrudeGeometry(shape, { depth: 2, bevelEnabled: false });
                        roofGeo.rotateX(-Math.PI/2);
                        const roofM = new THREE.Mesh(roofGeo, roofMat);
                        roofM.position.y = roofHeight;
                        group.add(roofM);

                        // Pillars
                        const pillarGeo = new THREE.CylinderGeometry(0.5, 0.5, roofHeight, 8);
                        const pillarMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
                        [startRad, endRad].forEach(ang => {
                            const pX = Math.cos(ang) * roofR;
                            const pZ = Math.sin(ang) * roofR;
                            //const pillar = new THREE.Mesh(pillarGeo, pillarMat);
                            const pillar = new THREE.Mesh(pillarGeo, new THREE.MeshStandardMaterial({ color: colorPillar }));
                            pillar.position.set(pX, roofHeight/2, pZ);
                            group.add(pillar);
                        });
                    } else {
                        const width = maxDepth + 4;
const pillarMat = new THREE.MeshStandardMaterial({ color: colorPillar });
                        const roofGeo = new THREE.BoxGeometry(width, 0.5, length + 4);
                        const roofM = new THREE.Mesh(roofGeo, roofMat);
                        roofM.position.set(width/2, roofHeight, 0);
                        group.add(roofM);

                        const pillarGeo = new THREE.CylinderGeometry(0.5, 0.5, roofHeight, 8);
                        //const pillarMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
                        [length/2, -length/2].forEach(z => {
                            const pillar = new THREE.Mesh(pillarGeo, pillarMat);
                            pillar.position.set(width/2 - 2, roofHeight/2, z);
                            group.add(pillar);
                        });
                    }
                }
                return group;
            }
            static dispose(group) {
                group.traverse((obj) => {
                    if (obj.isMesh) {
                        obj.geometry?.dispose();
                        if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
                        else obj.material?.dispose();
                    }
                });
            }
        }

        // --- MATH IMPORTED FROM DESIGNER TOOL ---
        /**
         * Core Math: Frame Transformation
         * This function calculates the new position and heading of the "car cursor"
         * based on the current frame and the segment definition.
         */
        function updateFrame(frame, seg) {
          if (seg.type === 'straight') {
            frame.x += Math.sin(frame.heading) * seg.length;
            frame.z += Math.cos(frame.heading) * seg.length;
          } else if (seg.type === 'arc') {
            const radius = seg.radius;
            const angle = seg.angleRad ? seg.angleRad : seg.angleDeg * 2 * Math.PI / 360;
            const direction = seg.direction; // 1 = left, -1 = right

            // Define basis vectors in global frame
            // Forward: {x: sin(heading), z: cos(heading)}
            // Left: {x: cos(heading), z: -sin(heading)}
            const left = { x: Math.cos(frame.heading), z: -Math.sin(frame.heading) };
            const forward = { x: Math.sin(frame.heading), z: Math.cos(frame.heading) };

            // Calculate center displacement from current position
            const center = {
              x: direction * radius * left.x,
              z: direction * radius * left.z
            };

            // Calculate end position relative to center
            let endPosLocalRelativeToCenter;
            if (direction === 1) {
              // Left turn: Start at (-r,0) relative to center, end at (-r*cos(angle), r*sin(angle))
              endPosLocalRelativeToCenter = {
                x: -radius * Math.cos(angle),
                z: radius * Math.sin(angle)
              };
            } else {
              // Right turn: Start at (r,0) relative to center, end at (r*cos(angle), r*sin(angle))
              endPosLocalRelativeToCenter = {
                x: radius * Math.cos(angle),
                z: radius * Math.sin(angle)
              };
            }

            // Update heading
            frame.heading += direction * angle;

            // Update position
            // Current position + center displacement + rotated end position
            frame.x += center.x + 
                       endPosLocalRelativeToCenter.x * left.x + 
                       endPosLocalRelativeToCenter.z * forward.x;
            frame.z += center.z + 
                       endPosLocalRelativeToCenter.x * left.z + 
                       endPosLocalRelativeToCenter.z * forward.z;
          }
        }

        // --- CUSTOM TRACK LOADER LOGIC ---
        /**
         * Process a segment and place Road Mesh in the 3D world
         */
        function processSegmentToRoadMesh(currentFrame, seg) {
            // Shared material for the road
            const material = new THREE.MeshStandardMaterial({ 
                color: 0x333333, 
                roughness: 0.8,
                side: THREE.DoubleSide 
            });

            if (seg.type === 'straight') {
                // Start point
                const p1 = { x: currentFrame.x, z: currentFrame.z };
                
                // Calculate end point
                const nextFrame = { ...currentFrame };
                updateFrame(nextFrame, seg);
                const p2 = { x: nextFrame.x, z: nextFrame.z };

                placeStraightMesh(p1, p2, params.roadWidth, material);

            } else if (seg.type === 'arc') {
                const radius = seg.radius;
                const angle = seg.angleRad ? seg.angleRad : seg.angleDeg * 2 * Math.PI / 360;
                const direction = seg.direction;

                // Calculate Center of Arc
                // Note: Keeping original logic to ensure compatibility with your coordinate system
                const left = { x: Math.cos(currentFrame.heading), z: -Math.sin(currentFrame.heading) };
                const center = {
                    x: currentFrame.x + direction * radius * left.x,
                    z: currentFrame.z + direction * radius * left.z
                };

                placeArcMesh(currentFrame, center, radius, angle, direction, params.roadWidth, material);



            // Calculate Start Angle (same as your Road Mesh logic)
            const dx = currentFrame.x - center.x;
            const dz = currentFrame.z - center.z;
            const startAngle = Math.atan2(dz, dx);

            // Define Board Properties
            const boardHeight = 0.8;
            const boardThickness = 0.2;

            // Place Outer Barrier (Outside the road)
            const outerRadius = radius + (params.roadWidth / 2) + (boardThickness/2);
            // Push it slightly further out so the road edge touches the inner side of the board
            const barrierOuterR = radius + (params.roadWidth / 2); 
            
            createArcBarrier(center, barrierOuterR, startAngle, (direction===-1?angle:-angle), boardHeight, boardThickness, 0xff0000);

        function placeStraightMesh(p1, p2, width, material) {
            const dx = p2.x - p1.x;
            const dz = p2.z - p1.z;
            const len = Math.sqrt(dx*dx + dz*dz);

            // Create Plane Geometry (Width X, Length Y)
            const geometry = new THREE.PlaneGeometry(width, len);
            const mesh = new THREE.Mesh(geometry, material);

mesh.rotation.order = 'YXZ';

            // Position at midpoint
            mesh.position.set((p1.x + p2.x) / 2, 0, (p1.z + p2.z) / 2);

            // Rotation
            // 1. Lay flat on XZ plane (Plane default is XY)
            mesh.rotation.x = -Math.PI / 2;

            // 2. Align length with the road direction
            // Default Plane length points to -Z (after rotation.x).
            // We need to calculate angle from -Z to our vector (dx, dz)
            // Angle of target vector:
            const targetAngle = Math.atan2(dz, dx);
            // Angle of current vector (-Z) is -PI/2
// - (-Math.PI / 2)
            mesh.rotation.y = Math.PI/2 -targetAngle;
//console.log(mesh.rotation);

// TAG THIS MESH AS ROAD
mesh.userData = { isRoad: true }; 

            roadGroup.add(mesh);
        }

        function placeArcMesh(startPoint, center, radius, angle, direction, width, material) {
            // Determine Inner and Outer radii
            const rIn = Math.max(0, radius - (width / 2));
            const rOut = radius + (width / 2);

            // Calculate start angle in World Space
            // Vector from Center to StartPoint
            const dx = startPoint.x - center.x;
            const dz = startPoint.z - center.z;
            const thetaStart = Math.atan2(dz, dx);

            // Determine arc length and direction
            // RingGeometry draws counter-clockwise for positive thetaLength
            // Direction 1 (Left) -> CCW (Positive)
            // Direction -1 (Right) -> CW (Negative)
            const thetaLength = (direction === 1) ? angle : -angle;

            // Create Ring Geometry
            // 32 radial segments for smoothness, 1 tubular segment (road has no thickness)
            const geometry = new THREE.RingGeometry(rIn, rOut, 32, 1, -1 * thetaStart, thetaLength);
            const mesh = new THREE.Mesh(geometry, material);

            // Rotation
            // RingGeometry is on XY plane. Rotate -PI/2 around X to lie flat on XZ.
            //mesh.rotation.x = (direction === 1) ? -Math.PI / 2 : Math.PI / 2;
mesh.rotation.x = -Math.PI / 2;

            // Position at center
            mesh.position.set(center.x, 0, center.z);

// TAG THIS MESH AS ROAD
mesh.userData = { isRoad: true }; 

            roadGroup.add(mesh);
        }

function clearCurrentRoad() {
    // Loop through all children (meshes) in the group
    for (let i = roadGroup.children.length - 1; i >= 0; i--) {
        const mesh = roadGroup.children[i];

        // 1. Dispose Geometry to free GPU memory

        // If you created a NEW material for every segment (like in the previous snippet), dispose it.
        // If you reuse a single global material variable, DO NOT dispose it here.
        if (mesh.material) mesh.material.dispose();
    }
}


        // Helper to create a vertical wall barrier along an arc
        function createArcBarrier(center, radius, startAngle, angleLength, height, thickness, color) {
            // 1. Setup Visuals
            const visualMaterial = new THREE.MeshStandardMaterial({ 
                color: color, 
                roughness: 0.5 
            });

            // 2. Setup Physics Material (for rebound effect)
            const physicsMaterial = new CANNON.Material({ 
                restitution: 0.5, // Bounciness (0.0 = no bounce, 1.0 = perfect bounce)
                friction: 0.3 
            });

            // 3. Calculate Segmentation
            // We create one box per meter of arc length to ensure the curve is smooth enough for collision
            const arcLength = Math.abs(radius * angleLength);
            const segmentLength = 1.0; // Length of each board piece
            const numSegments = Math.max(1, Math.floor(arcLength / segmentLength));
            const angleStep = angleLength / numSegments;

            for (let i = 0; i < numSegments; i++) {
                const currentAngle = startAngle + i * angleStep;
                const nextAngle = currentAngle + angleStep;
                
                // Mid-angle for positioning the segment
                const midAngle = currentAngle + (angleStep / 2);

                // --- POSITION ---
                // Polar to Cartesian coordinates
                const x = center.x + radius * Math.cos(midAngle);
                const z = center.z + radius * Math.sin(midAngle);

                // --- ROTATION ---
                // Calculate the tangent vector (direction of the road at this point)
                // Vector from current point to next point
                const dx = (center.x + radius * Math.cos(nextAngle)) - x;
                const dz = (center.z + radius * Math.sin(nextAngle)) - z;
                
                // Y-rotation needed to align the box's Z-axis (length) with the tangent
                const rotationY = Math.atan2(dz, dx);

                // --- DIMENSIONS ---
                // Actual length of this segment (chord length)
                const segmentWidth = Math.sqrt(dx*dx + dz*dz);

                // --- THREE.JS MESH ---
                // Box Geometry: Thickness (X), Height (Y), SegmentWidth (Z)
                // We align the Z-axis of the box with the road direction
                const geo = new THREE.BoxGeometry(thickness, height, segmentWidth);
                const mesh = new THREE.Mesh(geo, visualMaterial);
                mesh.position.set(x, height / 2, z);
                mesh.rotation.y = rotationY;
                scene.add(mesh);

                // --- CANNON.JS BODY ---
                const shape = new CANNON.Box(new CANNON.Vec3(thickness/2, height/2, segmentWidth/2));
                
                // Mass 0 makes it static (unmovable)
                const body = new CANNON.Body({ mass: 0, material: physicsMaterial }); 
                
                body.addShape(shape);
                body.position.set(x, height / 2, z);
                
                // Match rotation using Quaternion
                const q = new CANNON.Quaternion();
                q.setFromAxisAngle(new CANNON.Vec3(0,1,0), rotationY);
                body.quaternion = q;

                physicsWorld.addBody(body);
            }
        }

        function createCheckeredTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0,0,64,64);
            ctx.fillStyle = '#000000';
            for(let y=0; y<2; y++) {
                for(let x=0; x<2; x++) {
                    if ((x+y)%2===0) ctx.fillRect(x*32, y*32, 32, 32);
                }
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter;
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function clearCones() {

        function createCone(x, z) {
            const h = 0.7;
            const r = 0.25;
            const geo = new THREE.ConeGeometry(r, h, 16);
            const mat = new THREE.MeshStandardMaterial({ color: 0xffaa00 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, h/2, z);
            mesh.castShadow = true;
            scene.add(mesh);

            const shape = new CANNON.Cylinder(r, r, h, 8);
            const q = new CANNON.Quaternion();
            q.setFromAxisAngle(new CANNON.Vec3(1,0,0), -Math.PI/2); 
            
            const body = new CANNON.Body({ mass: 1 }); 
            body.addShape(shape, new CANNON.Vec3(0,0,0), q);
            body.position.set(x, h/2, z);
            body.linearDamping = 0.5;
            body.angularDamping = 0.5;
            physicsWorld.addBody(body);

            cones.push({ mesh, body });
        }

        function placeLine(p1, p2, count) {
            for(let i=1; i<=count; i++) {
                const t = i/count;
                const x = p1.x + (p2.x - p1.x) * t;
                const z = p1.z + (p2.z - p1.z) * t;
                
                const dx = p2.x - p1.x;
                const dz = p2.z - p1.z;
                const len = Math.sqrt(dx*dx + dz*dz);
                const nx = -dz / len; 
                const nz = dx / len;  
                
                createCone(x + nx * (params.roadWidth/2), z + nz * (params.roadWidth/2));
                createCone(x - nx * (params.roadWidth/2), z - nz * (params.roadWidth/2));
            }
        }

        // Original Arc logic for U-Turn preset
        function placeArc(center, radius, startAngle, endAngle, count) {
            const diff = endAngle - startAngle;
            const step = diff / count;

            for(let i=1; i<=count; i++) {
                const angle = startAngle + step * i;
                
                const rOut = radius + (params.roadWidth/2);
                createCone(center.x + Math.cos(angle) * rOut, center.z + Math.sin(angle) * rOut);
                
                const rIn = radius - (params.roadWidth/2);
                createCone(center.x + Math.cos(angle) * rIn, center.z + Math.sin(angle) * rIn);
            }
        }

         // --- HELPER: Calculate Endpoints of a Checkered Line Mesh ---
        function getLineEndpoints(mesh, width) {
            // Extract position and rotation
            const pos = mesh.position;
            // Mesh is rotated X -90 deg. Y rotation is the heading.
            // Quaternion logic: mesh.quaternion.
            // We can use the object's local vectors to find "Left"
            
            // Local forward is +Z. Local Left is +X.
            const localLeft = new THREE.Vector3(1, 0, 0);
            localLeft.applyQuaternion(mesh.quaternion);
            
            const halfWidth = width / 2;
            
            const p1 = new THREE.Vector3().copy(pos).add(localLeft.clone().multiplyScalar(-halfWidth));
            const p2 = new THREE.Vector3().copy(pos).add(localLeft.clone().multiplyScalar(halfWidth));
            
            return { p1, p2 };
        }

        function checkLineCrossing(carPos, prevPos, lineP1, lineP2, prevSideVal, roadWidth) {
            // 1. Projection Check: Is car "between" the line ends (with some tolerance)?
            const lineVec = new THREE.Vector3().subVectors(lineP2, lineP1);
            const carToP1 = new THREE.Vector3().subVectors(carPos, lineP1);
            const lineLenSq = lineVec.lengthSq();
            const t = carToP1.dot(lineVec) / lineLenSq;
            
            // 2. Side Check (Cross Product)
            // 2D Cross product of (LineVec) and (CarToP1) -> (x1*z2 - z1*x2) (ignoring Y)
            // We can use Vector3.cross().y
            const crossProd = new THREE.Vector3().crossVectors(lineVec, carToP1).y;
            const currentSide = Math.sign(crossProd);

            // Tolerance of 0.2 (20%) allows crossing slightly near edges
            if (t < -0.2 || t > 1.2) return { crossed: false, newSide: currentSide };


            
            // Check for sign change (crossing)
            // We also treat 0 (on the line) as a potential state change
            if (prevSideVal !== 0 && currentSide !== 0 && Math.sign(prevSideVal) !== currentSide) {
                return { crossed: true, newSide: currentSide };
            }
            
            // If we were on the line (0) and now off it, we crossed. 
            // Determine direction based on car movement relative to line normal? 
            // Simplified: if prev was 0, and current != 0, we crossed.
            if (prevSideVal === 0 && currentSide !== 0) {
                return { crossed: true, newSide: currentSide };
            }

            return { crossed: false, newSide: currentSide };
        }

        function loadCourseFromParams() {
            clearCones();
            resetTimer();

            if (params.coursePreset === 'Empty') {
                // Just clean up, leave ground
                startLineMesh.visible = false;
                finishLineMesh.visible = false;
                resetCarPhysics();
                return;
            }

            startLineMesh.visible = true;
            finishLineMesh.visible = true;

            if (params.coursePreset === 'U-Turn') {
                // U-Turn Geometry
                const p1 = { x: 0, z: 0 };
                const p2 = { x: 0, z: params.straightLength };
                placeLine(p1, p2, 10);

                const turnCenter = { x: params.turnRadius, z: params.straightLength };
                const startAngle = Math.PI;
                const endAngle = 0;
                placeArc(turnCenter, params.turnRadius, startAngle, endAngle, 20);

                const p3 = { x: params.turnRadius * 2, z: params.straightLength };
                const p4 = { x: params.turnRadius * 2, z: params.straightLength - params.exitLength }; 
                placeLine(p3, p4, 10);

                // Set Start/Finish Visuals
                startLineMesh.scale.set(params.roadWidth, 1, 2);
                startLineMesh.position.set(0, 0.02, 0);
                startLineMesh.rotation.set(-Math.PI/2, 0, 0);

            
            // Calculate Start Line Endpoints for Timer
            const startEnds = getLineEndpoints(startLineMesh, params.roadWidth);
            timerState.startP1.copy(startEnds.p1);
            timerState.startP2.copy(startEnds.p2);


                timerState.finishZ = p4.z;
                timerState.finishX = p4.x;
                
                finishLineMesh.scale.set(params.roadWidth, 1, 2);
                finishLineMesh.position.set(p4.x, 0.02, p4.z);
                finishLineMesh.rotation.set(-Math.PI/2, 0, 0);

            
            // Calculate Finish Line Endpoints
            const finishEnds = getLineEndpoints(finishLineMesh, params.roadWidth);
            timerState.finishP1.copy(finishEnds.p1);
            timerState.finishP2.copy(finishEnds.p2);

                resetCarPhysics();
            } 
            else if (params.coursePreset === 'Custom') {
                // Don't auto-load anything, wait for file upload
                // But we need to reset the car to start position
                startLineMesh.scale.set(params.roadWidth, 1, 2);
                startLineMesh.position.set(0, 0.02, 0);
                startLineMesh.rotation.set(-Math.PI/2, 0, 0);
                
                // Hide finish line until loaded
                finishLineMesh.visible = false;
                resetCarPhysics();
            }
        }

        function initPhysicsWorld() {
            physicsWorld = new CANNON.World();
            physicsWorld.gravity.set(0, params.gravity, 0);
            physicsWorld.broadphase = new CANNON.SAPBroadphase(physicsWorld);

            const groundMat = new CANNON.Material('ground');
            const wheelMat = new CANNON.Material('wheel');
            const coneMat = new CANNON.Material('cone');
            
            const contact = new CANNON.ContactMaterial(wheelMat, groundMat, {
                frictionSlip: params.frictionSlip, restitution: 0.0, contactEquationStiffness: 1000
            });
            physicsWorld.addContactMaterial(contact);

            const coneContact = new CANNON.ContactMaterial(groundMat, coneMat, {
                friction: 0.5, restitution: 0.5
            });
            physicsWorld.addContactMaterial(coneContact);

            const groundBody = new CANNON.Body({ mass: 0, material: groundMat });
            groundBody.addShape(new CANNON.Plane());
            groundBody.quaternion.setFromEuler(-Math.PI/2, 0, 0);
            physicsWorld.addBody(groundBody);

            const shape = new CANNON.Box(new CANNON.Vec3(0.9, 0.3, 2));
            chassisBody = new CANNON.Body({ mass: params.mass, material: wheelMat });
            chassisBody.addShape(shape);
            chassisBody.angularDamping = 0.5;

            vehicle = new CANNON.RaycastVehicle({
                chassisBody: chassisBody,
                indexRightAxis: 0, indexUpAxis: 1, indexForwardAxis: 2
            });

            const wheelConfig = {
                radius: 0.4,
                directionLocal: new CANNON.Vec3(0, -1, 0),
                suspensionStiffness: params.suspensionStiffness,
                suspensionRestLength: params.suspensionRestLength,
                frictionSlip: params.frictionSlip,
                dampingRelaxation: 2.3,
                dampingCompression: 4.4,
                rollInfluence: params.rollInfluence,
                axleLocal: new CANNON.Vec3(-1, 0, 0),
                maxSuspensionForce: 100000,
                maxSuspensionTravel: 0.3,
                customSlidingRotationalSpeed: -30,
                useCustomSlidingRotationalSpeed: true
            };

            vehicle.addWheel({ ...wheelConfig, chassisConnectionPointLocal: new CANNON.Vec3(0.8, -0.2, 1.2) });
            vehicle.addWheel({ ...wheelConfig, chassisConnectionPointLocal: new CANNON.Vec3(-0.8, -0.2, 1.2) });
            vehicle.addWheel({ ...wheelConfig, chassisConnectionPointLocal: new CANNON.Vec3(0.8, -0.2, -1.2) });
            vehicle.addWheel({ ...wheelConfig, chassisConnectionPointLocal: new CANNON.Vec3(-0.8, -0.2, -1.2) });

            vehicle.addToWorld(physicsWorld);
        }

            chassisBody.angularVelocity.set(0,0,0);
            
            transmission.gear = 1;
            transmission.rpm = transmission.idleRPM;
            transmission.smoothedVelocity = 0;

            const initStart = checkLineCrossing(chassisBody.position, chassisBody.position, timerState.startP1, timerState.startP2, 0, params.roadWidth);
            timerState.prevSideStart = initStart.newSide;
            const initFinish = checkLineCrossing(chassisBody.position, chassisBody.position, timerState.finishP1, timerState.finishP2, 0, params.roadWidth);
            timerState.prevSideFinish = initFinish.newSide;
            
            resetTimer();

        function formatTime(ms) {
            const m = Math.floor(ms / 60000);
            const s = Math.floor((ms % 60000) / 1000);
            const cs = Math.floor((ms % 1000) / 10);
            return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}.${cs.toString().padStart(2,'0')}`;
        }

        function drawTorqueCurve() {
            const canvas = document.getElementById('curve-canvas');
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;

            ctx.clearRect(0, 0, w, h);

            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for(let i=0; i<5; i++) {
                const y = i * (h/4);
                ctx.moveTo(0, y); ctx.lineTo(w, y);
            }
            ctx.stroke();

            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 3;
            ctx.beginPath();

            const maxRpmDisplay = 8000;
            const maxTorqueDisplay = params.maxEnginePower * 1.5;

            const getX = (rpm) => (rpm / maxRpmDisplay) * w;
            const getY = (torque) => h - (torque / maxTorqueDisplay) * h;

            for (let r = 0; r <= maxRpmDisplay; r += 100) {
                let diff = r - transmission.optimalRPM;
                let range = transmission.optimalRPM - transmission.idleRPM;
                
                let tFactor = 1 - Math.pow((diff) / range, 2);
                tFactor = Math.max(0, tFactor);
                if (r > transmission.redline) tFactor *= 0.1;

                const torque = params.maxEnginePower * tFactor;

                if (r === 0) ctx.moveTo(getX(r), getY(torque));
                else ctx.lineTo(getX(r), getY(torque));
            }
            ctx.stroke();

            ctx.fillStyle = '#ffaa00';
            ctx.beginPath();
            let currentDiff = transmission.rpm - transmission.optimalRPM;
            let currentRange = transmission.optimalRPM - transmission.idleRPM;
            let currentFactor = 1 - Math.pow((currentDiff) / currentRange, 2);
            currentFactor = Math.max(0, currentFactor);
            if (transmission.rpm > transmission.redline) currentFactor *= 0.1;
            let currentTorque = params.maxEnginePower * currentFactor;
            
            ctx.arc(getX(transmission.rpm), getY(currentTorque), 5, 0, Math.PI*2);
            ctx.fill();
        }

        function updatePhysics() {
            if (isNaN(chassisBody.position.x)) {
                resetCarPhysics();
                return;
            }

            physicsWorld.step(1/60, 1/60, params.substeps);

            // 1. Raycast down from the car's position
            raycaster.set(chassisBody.position, downVector);

            // Get all meshes that are tagged as 'road'
            // (Assuming you have an array 'roadMeshes' or use scene.traverse)
            // For simplicity in this snippet, let's assume you intersect against the whole scene
            // and check the userData in the result.
            const intersects = raycaster.intersectObjects(scene.children);

            let onRoad = false;

            // 2. Check if we hit the road mesh
            // We look for the first object that is tagged as a road
            for (let i = 0; i < intersects.length; i++) {
                if (intersects[i].object.userData.isRoad) {
                    onRoad = true;
                    break;
                }
            }

            // 3. Apply Damping based on surface
            if (onRoad) {
                chassisBody.linearDamping = ROAD_DAMPING;
                chassisBody.angularDamping = ROAD_ANGULAR_DAMPING;
            } else {
                // We are on the "Base Ground" (Grass/Mud)
                chassisBody.linearDamping = GRASS_DAMPING;
                chassisBody.angularDamping = GRASS_ANGULAR_DAMPING;
            }//test

            // Steering
            let steering = 0;
            if (inputs.a) steering = params.maxSteer;
            if (inputs.d) steering = -params.maxSteer;
            vehicle.setSteeringValue(steering, 0);
            vehicle.setSteeringValue(steering, 1);

            // Engine Force Calculation
            let engineForce = 0;

let isReverse = (chassisBody.velocity.dot(chassisBody.quaternion.vmult(new CANNON.Vec3(0,0,1))) * 3.6 < 2.0);

            if (params.engineType === 'Electric') {
                if (inputs.w) engineForce = -params.maxEnginePower;
                if (inputs.s) engineForce = params.maxEnginePower * 0.3; //0.3
            } else {
                // AT (Internal Combustion) Logic
                const v = Math.abs(chassisBody.velocity.dot(chassisBody.quaternion.vmult(new CANNON.Vec3(0,0,1)))); 

                transmission.smoothedVelocity += (v - transmission.smoothedVelocity) * 0.1;
                const safeV = transmission.smoothedVelocity;

                const wheelRpm = (safeV / (2 * Math.PI * 0.4)) * 60;
                
                const gearRatio = transmission.gearRatios[transmission.gear - 1];
                
                let targetRpm = Math.max(transmission.idleRPM, wheelRpm * gearRatio * transmission.finalDrive);
                if (inputs.w && safeV < 5.0) targetRpm = 5500*0.7; 
                transmission.rpm += (targetRpm - transmission.rpm) * 0.1; 

                // 3. Auto Shift Logic
                if (transmission.rpm > transmission.redline && transmission.gear < 5) {
                    transmission.gear++;
                } 
                else if (transmission.rpm < 2500 && transmission.gear > 1 && !inputs.s) {
                    transmission.gear--;
                }

                // 4. Calculate Torque
                let diff = transmission.rpm - transmission.optimalRPM;
                let range = transmission.optimalRPM - transmission.idleRPM;
                
                let torqueFactor = 1 - Math.pow((diff) / range, 2);
                torqueFactor = Math.max(0.1, torqueFactor); 

                if (transmission.rpm > transmission.redline) {
                    torqueFactor *= 0.1; 
                }

                const maxTorque = 120; 
                let currentTorque = maxTorque * torqueFactor;

                let clutchEngagement = 1.0;
                if (safeV < 3.0) clutchEngagement = safeV / 3.0; 
                if (safeV < 0.5 && inputs.w) clutchEngagement = 0.3; 

                currentTorque *= clutchEngagement;

                if (inputs.s) currentTorque = -50;
                if (inputs.space) currentTorque = 0;

                const force = (currentTorque * (params.maxEnginePower / 120)) * gearRatio  / 0.4; 
                
                if (document.getElementById('curve-panel').style.display === 'block') {
                    drawTorqueCurve();
                }

                if (inputs.w) engineForce = -force;
                if (inputs.s) engineForce = force; //test

                uiGear.innerText = `Gear: ${transmission.gear}, F=${Math.ceil(force)}`;
            }

if (isReverse && inputs.s) {
engineForce = params.maxEnginePower * 0.5;
if (params.engineType !== 'Electric') {
engineForce = engineForce * 5;
}
}

            // Apply Force to Rear Wheels
            vehicle.applyEngineForce(engineForce, 2);
            vehicle.applyEngineForce(engineForce, 3);

            // Brakes
            for(let i=0; i<4; i++) vehicle.setBrake(0, i);
            if (inputs.s && !inputs.w && !isReverse) {
                vehicle.setBrake(params.brakeForce, 0);
                vehicle.setBrake(params.brakeForce, 1);
                vehicle.setBrake(params.brakeForce, 2);
                vehicle.setBrake(params.brakeForce, 3);
            }
            if (inputs.space) {
                vehicle.setBrake(params.brakeForce * 3, 2);
                vehicle.setBrake(params.brakeForce * 3, 3);
            }
//TODO: chassisBody.velocity.length() * 3.6


            // Sync Visuals
            carMesh.position.copy(chassisBody.position);
            carMesh.quaternion.copy(chassisBody.quaternion);

            for (let i = 0; i < vehicle.wheelInfos.length; i++) {
                vehicle.updateWheelTransform(i);
                const t = vehicle.wheelInfos[i].worldTransform;
                wheelMeshes[i].position.copy(t.position);
                wheelMeshes[i].quaternion.copy(t.quaternion);
            }

            cones.forEach(c => {
                c.mesh.position.copy(c.body.position);
                c.mesh.quaternion.copy(c.body.quaternion);
            });

            // UI Updates
            const speedKmh = Math.round(chassisBody.velocity.length() * 3.6);
            //uiSpeed.innerText = `${speedKmh} (${chassisBody.velocity.dot(chassisBody.quaternion.vmult(new CANNON.Vec3(0,0,1)))})`;
uiSpeed.innerText = speedKmh;

            // Only check timer if we have a finish line set (not Empty mode before load)
            if (finishLineMesh.visible) {
                checkTimer(carMesh.position);
            }
            prevCarPos.copy(carMesh.position);
        }

        function updateCamera() {
            controls.update();

            if (params.cameraMode === 'Orbit') {
                controls.target.copy(carMesh.position);
                return;
            }

            const carPos = carMesh.position.clone();
            const carQuat = carMesh.quaternion.clone();
            
            const forward = new THREE.Vector3(0, 0, 1);
            forward.applyQuaternion(carQuat);
            forward.y = 0; 
            forward.normalize();
            
            const carAngle = Math.atan2(forward.x, forward.z);

            if (params.cameraMode === 'Driver') {
                const dist = -0.7; //1.2
                const height = 0.75;//0.7
                
                const offsetX = -Math.sin(carAngle) * dist;
                const offsetZ = -Math.cos(carAngle) * dist;

                camera.position.set(
                    carPos.x + offsetX,
                    carPos.y + height,
                    carPos.z + offsetZ
                );
                
                const lookTarget = carPos.clone().add(forward.multiplyScalar(10)); 
                camera.lookAt(lookTarget);

            } else if (params.cameraMode === 'Chase') {
                const dist = 12;
                const height = 6;
                
                const offsetX = -Math.sin(carAngle) * dist;
                const offsetZ = -Math.cos(carAngle) * dist;

                camera.position.x += (carPos.x + offsetX - camera.position.x) * 0.1;
                camera.position.z += (carPos.z + offsetZ - camera.position.z) * 0.1;
                camera.position.y += (carPos.y + height - camera.position.y) * 0.1;

                camera.lookAt(carPos);
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            updatePhysics();
            updateCamera();
            renderer.render(scene, camera);
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Initialize immediately
        init();
    </script>
</body>
</html>

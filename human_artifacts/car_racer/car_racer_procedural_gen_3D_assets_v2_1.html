<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Racer Game Jam - 3D Asset Generator (SDK)</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-bg: rgba(20, 20, 20, 0.95);
            --text-color: #e0e0e0;
            --accent-color: #00bcd4;
            --code-bg: #111;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace; /* Monospace for code feel */
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* UI Overlay Wrapper */
        #ui-wrapper {
            position: absolute;
            top: 20px;
            left: 20px;
            bottom: 20px;
            width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            pointer-events: none;
            z-index: 10;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            pointer-events: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .header-box h1 {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* Header font normal */
            font-size: 1.1rem;
            margin: 0 0 10px 0;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header-box p {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 0.85rem;
            margin: 0;
            color: #aaa;
        }

        /* Code Panel */
        .code-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1; /* Fill remaining space */
            min-height: 200px;
        }

        .code-header {
            font-size: 0.8rem;
            color: #888;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        pre {
            background: var(--code-bg);
            border: 1px solid #333;
            border-radius: 4px;
            padding: 10px;
            margin: 0;
            overflow-y: auto;
            flex-grow: 1;
            font-size: 0.8rem;
            color: #aaddff;
        }

        /* Highlighting classes for simple syntax highlighting */
        .kw { color: #ff79c6; } /* Keyword */
        .fn { color: #8be9fd; } /* Function */
        .str { color: #f1fa8c; } /* String */
        .num { color: #bd93f9; } /* Number */
        .cmt { color: #6272a4; font-style: italic; } /* Comment */

        .controls-hint {
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.75rem;
            color: #555;
            margin-top: 10px;
            text-align: center;
        }

        #loader {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            display: flex; justify-content: center; align-items: center;
            z-index: 999;
            transition: opacity 0.5s;
        }
        
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #333; border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Lil-GUI Position */
        .lil-gui.root {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div>Initializing SDK...</div>
    </div>

    <div id="ui-wrapper">
        <!-- Header Info -->
        <div class="panel header-box">
            <h1>Racer Asset SDK</h1>
            <p>Configure your procedural assets below. The code panel displays the exact implementation for your game.</p>
        </div>

        <!-- Code Output Panel -->
        <div class="panel code-container">
            <div class="code-header">
                <span>DEVELOPER INTEGRATION CODE</span>
                <span id="copy-hint" style="opacity: 0; transition: opacity 0.5s; color: var(--accent-color);">Updated!</span>
            </div>
            <pre id="code-output">
                <!-- Code injected via JS -->
            </pre>
        </div>
        
        <div class="panel" style="padding: 10px;">
             <div class="controls-hint">
                Left Click: Rotate | Right Click: Pan | Scroll: Zoom
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        // ==========================================
        // CLASS: AssetGenerator
        // This is the reusable class for your game.
        // ==========================================
        class AssetGenerator {
            
            /**
             * Creates a procedural stadium.
             * @param {Object} config - Configuration object matching the GUI state.
             * @returns {THREE.Group} - The root 3D object.
             */
            static createStadium(config) {
                const group = new THREE.Group();
                const { radius, startAngle, endAngle, length, tiers, rowsPerTier, seatWidth, rowDepth, crowdDensity, colorSeats, colorCrowd, addRoof, roofHeight, roofColor, mode, colorBase, audienceColors, colorPillar } = config;

                const seatsData = [];
                let maxR = 0;
                let maxDepth = 0; // For linear

                const startRad = THREE.MathUtils.degToRad(startAngle);
                const endRad = THREE.MathUtils.degToRad(endAngle);
                const angleSpan = endRad - startRad;

                // --- 1. Calculate Positions ---
                for (let t = 0; t < tiers; t++) {
                    const tierOffset = t * (rowsPerTier * rowDepth);
                    for (let r = 0; r < rowsPerTier; r++) {
                        const rowOffset = tierOffset + (r * rowDepth);
                        
                        if (mode === 'Arc') {
                            const currentRadius = radius + rowOffset;
                            const circumference = currentRadius * angleSpan;
                            const seatsInRow = Math.max(1, Math.floor(circumference / seatWidth));
                            maxR = Math.max(maxR, currentRadius);

                            for (let s = 0; s < seatsInRow; s++) {
                                const ratio = s / seatsInRow;
                                const angle = startRad + (ratio * angleSpan);
                                const x = Math.cos(angle) * currentRadius;
                                const z = Math.sin(angle) * currentRadius;
                                const y = (r + (t * rowsPerTier)) * 0.5;
                                seatsData.push({ x, y, z, rotY: -angle });
                            }
                        } else { // Linear
                            const currentDepth = 5 + rowOffset;
                            const seatsInRow = Math.floor(length / seatWidth);
                            maxDepth = Math.max(maxDepth, currentDepth);

                            for (let s = 0; s < seatsInRow; s++) {
                                const z = -length/2 + (s * seatWidth) + (seatWidth/2);
                                const x = currentDepth;
                                const y = (r + (t * rowsPerTier)) * 0.5;
                                seatsData.push({ x, y, z, rotY: Math.PI });
                            }
                        }
                    }
                }

                if (seatsData.length === 0) return group;

                // --- 2. Base Platform ---
                //const baseMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.8 });
                const baseMat = new THREE.MeshStandardMaterial({ color: colorBase, roughness: 0.8 });
                const baseHeight = 1.0;

                if (mode === 'Arc') {
                    /*const shape = new THREE.Shape();
                    shape.absarc(0, 0, maxR + 2, endRad, startRad, false);
                    const hole = new THREE.Path();
                    hole.absarc(0, 0, radius - 2, startRad, endRad, true);
                    shape.holes.push(hole);*/
                    // Create a proper Donut Sector shape without using 'holes' to fix geometry artifacts
                    // We trace the outer arc CCW, then line to inner, trace inner arc CW, then close.
                    const shape = new THREE.Shape();
                    const outerR = maxR + 2;
                    const innerR = radius - 2;

                    // Start at outer StartAngle
                    const startX = Math.cos(startRad) * outerR;
                    const startY = -Math.sin(startRad) * outerR;
                    shape.moveTo(startX, startY);

                    // Outer Arc (CCW from Start to End)
                    shape.absarc(0, 0, outerR, -startRad, -endRad, true);

                    // Line to Inner EndAngle
                    const endX = Math.cos(endRad) * innerR;
                    const endY = -Math.sin(endRad) * innerR;
                    shape.lineTo(endX, endY);

                    // Inner Arc (CW from End to Start) to create the 'band' effect
                    shape.absarc(0, 0, innerR, -endRad, -startRad, false);

                    // Close path (line back to outer start)
                    shape.lineTo(startX, startY);

 	
                    const geometry = new THREE.ExtrudeGeometry(shape, { depth: baseHeight, bevelEnabled: false });
                    geometry.rotateX(-Math.PI / 2); 
                    const baseMesh = new THREE.Mesh(geometry, baseMat);
                    baseMesh.receiveShadow = true;
                    baseMesh.castShadow = true;
                    group.add(baseMesh);
                } else {
                    const width = maxDepth + 4; // Using maxDepth as X-extent here
                    const baseGeo = new THREE.BoxGeometry(width, baseHeight, length);
                    const baseMesh = new THREE.Mesh(baseGeo, baseMat);
                    baseMesh.position.set(width/2, baseHeight/2, 0);
                    baseMesh.receiveShadow = true;
                    baseMesh.castShadow = true;
                    group.add(baseMesh);
                }

                // --- 3. Seats & Crowd ---
                const seatGeo = new THREE.BoxGeometry(seatWidth, 0.5, 1);
                const seatMat = new THREE.MeshStandardMaterial({ color: colorSeats });
                const seatMesh = new THREE.InstancedMesh(seatGeo, seatMat, seatsData.length);
                seatMesh.castShadow = true;
                seatMesh.receiveShadow = true;

                const crowdCount = Math.floor(seatsData.length * crowdDensity);
                const personGeo = new THREE.CylinderGeometry(0.35, 0.35, 1.6, 6);
                //const personMat = new THREE.MeshStandardMaterial({ color: colorCrowd });
                // Note: colorCrowd is deprecated, using audienceColors array
                const personMat = new THREE.MeshStandardMaterial({ color: 0xffffff }); // Base white, tinted by instanceColor
                const personMesh = new THREE.InstancedMesh(personGeo, personMat, crowdCount);
                personMesh.castShadow = true;
                personMesh.receiveShadow = true;
                personMesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(crowdCount * 3), 3);

                const dummy = new THREE.Object3D();
                const tempColor = new THREE.Color();

                let personIdx = 0;

                // Shuffle indices for random crowd distribution
                const indices = seatsData.map((_, i) => i);
                for (let i = indices.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [indices[i], indices[j]] = [indices[j], indices[i]];
                }
                const personIndices = new Set(indices.slice(0, crowdCount));

                for (let i = 0; i < seatsData.length; i++) {
                    const d = seatsData[i];
                    dummy.position.set(d.x, d.y + 0.25, d.z);
                    dummy.rotation.set(0, d.rotY, 0);
                    dummy.updateMatrix();
                    seatMesh.setMatrixAt(i, dummy.matrix);

                    if (personIndices.has(i)) {
                        dummy.position.set(d.x, d.y + 0.25 + 0.8, d.z);
                        dummy.scale.set(1, 0.9 + Math.random()*0.2, 1);
                        dummy.updateMatrix();
                        personMesh.setMatrixAt(personIdx++, dummy.matrix);

                        
                        // Assign random color from palette
                        const randomCol = audienceColors[Math.floor(Math.random() * audienceColors.length)];
                        tempColor.set(randomCol);
                        personMesh.setColorAt(personIdx, tempColor);
                        

                        dummy.scale.set(1, 1, 1);
                    }
                }
                group.add(seatMesh);
                group.add(personMesh);

                // --- 4. Roof ---
                if (addRoof) {
                    const roofMat = new THREE.MeshStandardMaterial({ color: roofColor, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
                    if (mode === 'Arc') {
                        //const roofR = maxR + 2;
                        const shape = new THREE.Shape();

                        /*shape.absarc(0, 0, roofR, endRad, startRad, false);
                        const hole = new THREE.Path();
                        hole.absarc(0, 0, radius - 2, startRad, endRad, true);
                        shape.holes.push(hole);*/
                    // Create a proper Donut Sector shape without using 'holes' to fix geometry artifacts
                    // We trace the outer arc CCW, then line to inner, trace inner arc CW, then close.
                    //const shape = new THREE.Shape();
                    const outerR = maxR + 2;
                    const innerR = radius - 2;

                    // Start at outer StartAngle
                    const startX = Math.cos(startRad) * outerR;
                    const startY = -Math.sin(startRad) * outerR;
                    shape.moveTo(startX, startY);

                    // Outer Arc (CCW from Start to End)
                    shape.absarc(0, 0, outerR, -startRad, -endRad, true);

                    // Line to Inner EndAngle
                    const endX = Math.cos(endRad) * innerR;
                    const endY = -Math.sin(endRad) * innerR;
                    shape.lineTo(endX, endY);

                    // Inner Arc (CW from End to Start) to create the 'band' effect
                    shape.absarc(0, 0, innerR, -endRad, -startRad, false);

                    // Close path (line back to outer start)
                    shape.lineTo(startX, startY);

let roofR = outerR;


                        const roofGeo = new THREE.ExtrudeGeometry(shape, { depth: 2, bevelEnabled: false });
                        roofGeo.rotateX(-Math.PI/2);
                        const roofM = new THREE.Mesh(roofGeo, roofMat);
                        roofM.position.y = roofHeight;
                        group.add(roofM);

                        // Pillars
                        const pillarGeo = new THREE.CylinderGeometry(0.5, 0.5, roofHeight, 8);
                        const pillarMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
                        [startRad, endRad].forEach(ang => {
                            const pX = Math.cos(ang) * roofR;
                            const pZ = Math.sin(ang) * roofR;
                            //const pillar = new THREE.Mesh(pillarGeo, pillarMat);
                            const pillar = new THREE.Mesh(pillarGeo, new THREE.MeshStandardMaterial({ color: colorPillar }));
                            pillar.position.set(pX, roofHeight/2, pZ);
                            group.add(pillar);
                        });
                    } else {
                        const width = maxDepth + 4;
const pillarMat = new THREE.MeshStandardMaterial({ color: colorPillar });
                        const roofGeo = new THREE.BoxGeometry(width, 0.5, length + 4);
                        const roofM = new THREE.Mesh(roofGeo, roofMat);
                        roofM.position.set(width/2, roofHeight, 0);
                        group.add(roofM);

                        const pillarGeo = new THREE.CylinderGeometry(0.5, 0.5, roofHeight, 8);
                        //const pillarMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
                        [length/2, -length/2].forEach(z => {
                            const pillar = new THREE.Mesh(pillarGeo, pillarMat);
                            pillar.position.set(width/2 - 2, roofHeight/2, z);
                            group.add(pillar);
                        });
                    }
                }
                return group;
            }

            /**
             * Creates a procedural building.
             * @param {Object} config - Configuration object.
             * @returns {THREE.Group} - The root 3D object.
             */
            static createBuilding(config) {
                const group = new THREE.Group();
                const { width, height, depth, wallColor, windowColorLit, windowColorDark, windowLitPercent, roofType } = config;

                // Texture Generation
                const texture = this.createBuildingTexture(windowColorLit, windowColorDark, windowLitPercent);
                
                const texScale = 4.0;
                const repeatX_FB = Math.ceil(width / texScale);
                const repeatY = Math.ceil(height / texScale);
                const repeatX_S = Math.ceil(depth / texScale);

                // Materials
                const matFB = new THREE.MeshStandardMaterial({ color: wallColor, map: texture.clone(), roughness: 0.2 });
                matFB.map.repeat.set(repeatX_FB, repeatY);
                matFB.map.wrapS = matFB.map.wrapT = THREE.RepeatWrapping;

                const matSide = new THREE.MeshStandardMaterial({ color: wallColor, map: texture.clone(), roughness: 0.2 });
                matSide.map.repeat.set(repeatX_S, repeatY);
                matSide.map.wrapS = matSide.map.wrapT = THREE.RepeatWrapping;

                const matTop = new THREE.MeshStandardMaterial({ color: 0x222222 });

                const materials = [matSide, matSide, matTop, matTop, matFB, matFB];

                const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), materials);
                mesh.position.y = height / 2;
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                group.add(mesh);

                if (roofType === 'Slanted') {
                    const roofGeo = new THREE.ConeGeometry(Math.max(width, depth) * 0.7, 8, 4);
                    const roofMat = new THREE.MeshStandardMaterial({ color: 0x444444 });
                    const roof = new THREE.Mesh(roofGeo, roofMat);
                    roof.position.y = height + 4;
                    roof.rotation.y = Math.PI / 4;
                    roof.castShadow = true;
                    group.add(roof);
                }

                return group;
            }

            static createBuildingTexture(colLit, colDark, litPercent) {
                const size = 512;
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#333'; 
                ctx.fillRect(0, 0, size, size);
                
                const cols = 4, rows = 6, pad = 20;
                const w = (size - (cols + 1) * pad) / cols;
                const h = (size - (rows + 1) * pad) / rows;

                for(let y=0; y<rows; y++) {
                    for(let x=0; x<cols; x++) {
                        ctx.fillStyle = Math.random() < litPercent ? colLit : colDark;
                        ctx.fillRect(pad + x*(w+pad), pad + y*(h+pad), w, h);
                    }
                }
                const tex = new THREE.CanvasTexture(canvas);
                tex.colorSpace = THREE.SRGBColorSpace;
                return tex;
            }

            static dispose(group) {
                group.traverse((obj) => {
                    if (obj.isMesh) {
                        obj.geometry?.dispose();
                        if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
                        else obj.material?.dispose();
                    }
                });
            }
        }

        // ==========================================
        // MAIN APP LOGIC (The Web Tool)
        // ==========================================
        
        let scene, camera, renderer, controls;
        let currentAssetGroup = new THREE.Group();
        let gui = new GUI({ title: 'Asset Config' });
        
        // Configuration State (Default values)
        const config = {
            assetType: 'Stadium',
            stadium: {
                mode: 'Arc', radius: 40, startAngle: 0, endAngle: 180,
                length: 80, tiers: 2, rowsPerTier: 8, seatWidth: 1.2, rowDepth: 1.5,
                crowdDensity: 0.6, 
                colorSeats: '#888888', 
                colorBase: '#555555', 
                colorPillar: '#888888', 
                addRoof: false, roofHeight: 15, roofColor: '#eeeeee',
                audienceColors: ['#ffffff', '#ffcccb', '#add8e6', '#e6e6fa'] // Random audience palette
            },
            building: {
                width: 20, height: 60, depth: 20,
                wallColor: '#555555', windowColorLit: '#ffeb3b', windowColorDark: '#222222',
                windowLitPercent: 0.6, roofType: 'Flat'
            }
        };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x202025);
            scene.fog = new THREE.Fog(0x202025, 50, 300);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(60, 60, 80);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            setupLighting();
            setupEnvironment();
            scene.add(currentAssetGroup);

            setupGUI();
            regenerateAsset();
            updateCodePanel();

            window.addEventListener('resize', onWindowResize);
            
            setTimeout(() => {
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => document.getElementById('loader').remove(), 500);
            }, 600);

            animate();
        }

        function setupLighting() {
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(50, 80, 30);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);
        }

        function setupEnvironment() {
            const planeGeo = new THREE.PlaneGeometry(2000, 2000);
            const planeMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.8 });
            const plane = new THREE.Mesh(planeGeo, planeMat);
            plane.rotation.x = -Math.PI / 2;
            plane.receiveShadow = true;
            scene.add(plane);
            scene.add(new THREE.GridHelper(200, 50, 0x444444, 0x222222));
        }

        // --- Logic Bridge ---

        function regenerateAsset() {
            AssetGenerator.dispose(currentAssetGroup);
            currentAssetGroup.clear();

            if (config.assetType === 'Stadium') {
                const stadium = AssetGenerator.createStadium(config.stadium);
                currentAssetGroup.add(stadium);
            } else {
                const building = AssetGenerator.createBuilding(config.building);
                currentAssetGroup.add(building);
            }
            
            updateCodePanel();
        }

        // --- Code Panel Logic ---
        function updateCodePanel() {
            const output = document.getElementById('code-output');
            const type = config.assetType;
            let code = '';
            let params = '';

            // Helper to format object nicely
            const formatObj = (obj) => {
                return JSON.stringify(obj, null, 4)
                    .replace(/"([^"]+)":/g, '$1:') // remove quotes on keys
                    .replace(/"/g, "'"); // double to single quotes
            };

            if (type === 'Stadium') {
                const p = config.stadium;
                params = `{
    mode: '${p.mode}',
    radius: ${p.radius},
    startAngle: ${p.startAngle},
    endAngle: ${p.endAngle},
    tiers: ${p.tiers},
    crowdDensity: ${p.crowdDensity},
    // ... add other properties as needed
}`;
                code = `<span class="cmt">// 1. Import the class</span>
<span class="kw">import</span> { AssetGenerator } <span class="kw">from</span> <span class="str">'./assets.js'</span>;

<span class="cmt">// 2. Define configuration</span>
<span class="kw">const</span> stadiumConfig = ${params};

<span class="cmt">// 3. Generate and add to scene</span>
<span class="kw">const</span> stadium = AssetGenerator.<span class="fn">createStadium</span>(stadiumConfig);
scene.<span class="fn">add</span>(stadium);`;
            } else {
                const p = config.building;
                params = `{
    width: ${p.width},
    height: ${p.height},
    depth: ${p.depth},
    windowLitPercent: ${p.windowLitPercent},
    roofType: '${p.roofType}'
}`;
                code = `<span class="cmt">// 1. Import the class</span>
<span class="kw">import</span> { AssetGenerator } <span class="kw">from</span> <span class="str">'./assets.js'</span>;

<span class="cmt">// 2. Define configuration</span>
<span class="kw">const</span> buildingConfig = ${params};

<span class="cmt">// 3. Generate and add to scene</span>
<span class="kw">const</span> building = AssetGenerator.<span class="fn">createBuilding</span>(buildingConfig);
scene.<span class="fn">add</span>(building);`;
            }

            output.innerHTML = code;
            
            // Trigger copy hint
            const hint = document.getElementById('copy-hint');
            hint.style.opacity = '1';
            setTimeout(() => hint.style.opacity = '0', 1000);
        }

        // --- GUI Logic (Fixed) ---
        function setupGUI() {
            const assetCtrl = gui.add(config, 'assetType', ['Stadium', 'Building']).name('Asset Type').onChange(() => {
                updateGUIFolders();
                regenerateAsset();
            });

            const sFolder = gui.addFolder('Stadium Config');
            const s = config.stadium;
            
            // Stadium Params
            sFolder.add(s, 'mode', ['Arc', 'Linear']).name('Shape Mode').onChange(() => { updateGUIControllers(); regenerateAsset(); });
            sFolder.add(s, 'radius', 10, 100).name('Radius');
            sFolder.add(s, 'startAngle', 0, 360).name('Start Angle');
            sFolder.add(s, 'endAngle', 0, 360).name('End Angle');
            sFolder.add(s, 'length', 20, 200).name('Length (Linear)');
            sFolder.add(s, 'tiers', 1, 5, 1).name('Tiers');
            sFolder.add(s, 'rowsPerTier', 2, 15, 1).name('Rows/Tier');
            sFolder.add(s, 'crowdDensity', 0, 1).name('Crowd Density');
            sFolder.addColor(s, 'colorSeats').name('Seat Color');
            sFolder.addColor(s, 'colorBase').name('Base Color');
            sFolder.addColor(s, 'colorPillar').name('Pillar Color');
            sFolder.addColor(s, 'roofColor').name('Roof Color');

            sFolder.add(s, 'addRoof').name('Has Roof');
            sFolder.add(s, 'roofHeight', 5, 50).name('Roof Height');

            const bFolder = gui.addFolder('Building Config');
            const b = config.building;
            bFolder.add(b, 'width', 5, 50);
            bFolder.add(b, 'height', 5, 150);
            bFolder.add(b, 'depth', 5, 50);
            bFolder.add(b, 'windowLitPercent', 0, 1).name('Window Lit %');
            bFolder.add(b, 'roofType', ['Flat', 'Slanted']).name('Roof Type');

            // Add listeners to all controllers for regeneration
            gui.controllersRecursive().forEach(c => {
                c.onChange(regenerateAsset);
            });

            updateGUIFolders();
            updateGUIControllers();
        }

        function updateGUIFolders() {
            const isStadium = config.assetType === 'Stadium';
            gui.folders[0].show(isStadium);
            gui.folders[1].show(!isStadium);
        }

        function updateGUIControllers() {
            // Show/Hide controllers based on Stadium Mode (Arc vs Linear)
            const s = config.stadium;
            const controllers = gui.folders[0].controllersRecursive();
            
            controllers.forEach(c => {
                const name = c._name;
                if (name === 'Radius' || name === 'Start Angle' || name === 'End Angle') {
                    s.mode === 'Arc' ? c.show() : c.hide();
                } else if (name === 'Length (Linear)') {
                    s.mode === 'Linear' ? c.show() : c.hide();
                }
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // Boot
        init();

    </script>
</body>
</html>
